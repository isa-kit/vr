<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Sand Castle</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #bfe0f2; overflow: hidden; }
  canvas { display: block; touch-action: none; }
  #hud { position: fixed; top: 12px; left: 14px; z-index: 10;
    font: 13px/1.5 system-ui, sans-serif; color: rgba(40,35,20,.85);
    text-shadow: 0 1px 2px rgba(255,255,255,.5); pointer-events: none; max-width: 72vw; }
  #hud b { color: #6a4a10; font-weight: 650; }
  a.back { position: fixed; top: 12px; right: 14px; z-index: 11; font: 13px system-ui, sans-serif;
    color: #6a4a10; text-decoration: none; text-shadow: 0 1px 2px rgba(255,255,255,.5); }
  #enter { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(60% 60% at 50% 45%, rgba(10,20,30,.2), rgba(10,20,30,.5)); cursor: pointer; transition: opacity .5s ease; }
  #enter .card { text-align: center; color: #fff; font: 500 16px/1.5 system-ui, sans-serif; text-shadow: 0 2px 10px rgba(0,0,0,.5); }
  #enter h1 { font-size: 26px; font-weight: 650; margin: 0 0 6px; }
  #enter .go { margin-top: 14px; display: inline-block; padding: 10px 22px; border-radius: 999px; background: rgba(255,255,255,.94); color: #6a4a10; font-weight: 650; }
</style>
</head>
<body>
  <a class="back" href="../">← Worlds</a>
  <div id="hud">
    <b>Sand Castle</b><br>
    <span id="help">Drag sand to sculpt · wheel zooms · drag empty space or right-drag to orbit · Esc or M for the menu</span>
  </div>
  <div id="enter"><div class="card">
    <h1>Sand Castle</h1>
    Pile sand, stamp towers, build walls, dig moats. Click to start &amp; turn on sound.
    <div class="go">Enter →</div>
  </div></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
