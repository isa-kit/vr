<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Infinity Lights</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 12px; left: 14px; z-index: 10;
    font: 13px/1.5 system-ui, sans-serif; color: rgba(255,255,255,.78);
    text-shadow: 0 1px 3px rgba(0,0,0,.8); pointer-events: none; max-width: 70vw;
  }
  #hud b { color: #ffe9c2; font-weight: 600; }

  /* phone layout: safe areas, no overflow at 375 px, 44px+ touch targets */
  body { -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
  #hud { top: calc(env(safe-area-inset-top, 0px) + 10px) !important; left: calc(env(safe-area-inset-left, 0px) + 12px) !important;
    max-width: calc(100vw - 132px - env(safe-area-inset-left, 0px)) !important; overflow-wrap: anywhere; }
  a.back { top: calc(env(safe-area-inset-top, 0px) + 10px) !important; right: calc(env(safe-area-inset-right, 0px) + 12px) !important; }
  @media (pointer: coarse) {
    a.back { top: calc(env(safe-area-inset-top, 0px) + 4px) !important; padding: 12px 6px; font-size: 15px !important; }
    #hud { font-size: 12px !important; line-height: 1.35 !important; }
  }
</style>
</head>
<body>
  <a class="back" href="../" style="position:fixed;top:12px;right:14px;z-index:11;font:13px system-ui,sans-serif;color:#ffd27f;text-decoration:none;text-shadow:0 1px 3px rgba(0,0,0,.8)">← Worlds</a>
  <div id="hud">
    <b>Infinity Lights</b><br>
    <span id="help">Click to fly · WASD move · Q/E down-up · Shift boost · F plants a light · Esc or M for the menu</span>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./main.js?v=20261113lie3"></script>
</body>
</html>
