<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Oortia — calm immersive worlds</title>
<meta name="description" content="Oortia: calm, immersive worlds you can open in a browser or step into in VR. No install." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230a0d18'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='%23ffd27f'%3E✦%3C/text%3E%3C/svg%3E" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background:
      radial-gradient(1200px 700px at 50% -10%, #1a2340 0%, #0a0d18 55%, #05060d 100%);
    color: #eef1ff; font: 16px/1.55 system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 56px 16px 72px;
  }
  header { text-align: center; max-width: 640px; margin-bottom: 40px; }
  h1 { font-size: 30px; font-weight: 650; letter-spacing: .3px; margin: 0 0 8px; }
  h1 .mark { color: #ffd27f; }
  header p { margin: 0; color: rgba(238,241,255,.62); }
  .list { width: 100%; max-width: 880px; display: flex; flex-direction: column; gap: 22px; }
  .cols, .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .cols { padding: 0 4px; font-size: 11.5px; font-weight: 650; letter-spacing: .8px; text-transform: uppercase; color: rgba(238,241,255,.45); }
  .row-title { grid-column: 1 / -1; margin: 0 0 -6px; font-size: 13px; font-weight: 600; color: rgba(238,241,255,.55); display: none; }
  .card {
    position: relative; display: flex; gap: 14px; align-items: center; text-decoration: none; color: inherit;
    border: 1px solid rgba(255,255,255,.1); border-radius: 16px;
    background: rgba(18,22,38,.7); padding: 14px; overflow: hidden; min-width: 0;
    transition: transform .15s ease, border-color .15s ease, background .15s ease;
  }
  .card .thumb { flex: 0 0 84px; height: 84px; border-radius: 10px; }
  .card .body { min-width: 0; flex: 1; }
  .card h2 { font-size: 16.5px; margin: 0 0 4px; font-weight: 620; }
  .card p { margin: 0; font-size: 13px; line-height: 1.45; color: rgba(238,241,255,.6); }
  .badge {
    display: inline-block; font-size: 10.5px; font-weight: 650; margin-bottom: 6px;
    letter-spacing: .4px; text-transform: uppercase; padding: 3px 8px; border-radius: 999px;
  }
  .live   { cursor: pointer; }
  .live:hover   { transform: translateY(-2px); border-color: rgba(255,210,127,.5); background: rgba(24,30,52,.85); }
  .live   .badge { background: rgba(120,230,160,.16); color: #8ff0b4; }
  .soon   { opacity: .62; cursor: default; border-style: dashed; }
  .soon   .badge { background: rgba(255,200,120,.14); color: #ffd27f; }
  .enter { margin-top: 8px; font-size: 13px; font-weight: 620; color: #ffd27f; }
  .soon .enter { color: rgba(238,241,255,.4); }
  .godot.live:hover { border-color: rgba(120,200,255,.55); }
  .godot .enter { color: #7cc8ff; }
  .godot.soon .enter { color: rgba(238,241,255,.4); }
  @media (max-width: 640px) {
    body { padding-top: 40px; }
    .cols { display: none; }
    .row { grid-template-columns: 1fr; gap: 10px; }
    .row-title { display: block; }
    .row .card + .card { margin-left: 18px; }
    .card .thumb { flex-basis: 64px; height: 64px; }
  }
  footer { margin-top: 44px; font-size: 12.5px; color: rgba(238,241,255,.4); text-align: center; }
  footer a { color: rgba(238,241,255,.6); }
</style>
</head>
<body>
  <header>
    <h1><span class="mark">✦</span> Oortia</h1>
    <p>Calm, immersive places. Open one in your browser, or tap <b>Enter VR</b> on a headset. No install.</p>
  </header>

  <div class="list" aria-busy="true">
    <div class="cols" aria-hidden="true"><span>JavaScript · Three.js</span><span>Godot 4</span></div>
    <main id="grid" class="list"></main>
  </div>

  <footer>Best in a Quest / Android browser for VR &amp; AR · works flat on desktop.<br>
    <a href="catalog/" style="color:rgba(238,241,255,.7)">▦ Browse the VR app catalog →</a>
  </footer>

  <script type="module">
    const THUMBS = {
      infinity:      'radial-gradient(120px 90px at 30% 30%, #ffd27f55, transparent), radial-gradient(140px 110px at 75% 65%, #8a7dff55, transparent), #0b0f1d',
      'nature-glade':'linear-gradient(#8fc7f0, #cfe6c0 62%, #4a6b3a)',
      sandcastle:    'linear-gradient(#9fd2f0, #fdf4dc 58%, #e4c98a)',
      forest:        'linear-gradient(#cfe0c0, #6f9a56 45%, #1f3a22)',
      cliffs:        'linear-gradient(#f6c98a, #f0e4cc 38%, #3f86a8 40%, #1d4f6e)',
      beach:         'linear-gradient(#a9dcf2, #e8f6fb 42%, #5fb5d0 44%, #ecd9a3 70%)',
    };
    const grid = document.getElementById('grid');
    try {
      const { worlds } = await (await fetch('scenes/index.json')).json();
      const scenes = await Promise.all(
        worlds.map(id => fetch(`scenes/${id}.json`).then(r => r.json()))
      );
      const exists = p => fetch(p + '/index.html', { method: 'HEAD', cache: 'no-store' }).then(r => r.ok).catch(() => false);
      await Promise.all(scenes.map(async s => {
        if (s.status !== 'live' && await exists(s.path || s.id)) s.status = 'live';
        if (s.godot && s.godot.status !== 'live' && await exists(s.godot.path)) s.godot.status = 'live';
      }));
      const card = (s, engine) => {
        const g = engine === 'godot';
        const cfg = g ? (s.godot || {}) : { status: s.status, path: s.path || s.id };
        const live = cfg.status === 'live';
        const tag = live ? 'a' : 'div';
        const href = live ? ` href="${cfg.path}/"` : '';
        const label = g ? (live ? 'Ready' : 'In progress') : (live ? 'Ready' : 'Soon');
        const cta = live ? 'Enter →' : (g ? 'Godot build in progress' : 'In the works');
        return `<${tag} class="card ${g ? 'godot' : 'js'} ${live ? 'live' : 'soon'}"${href}>
          <div class="thumb" style="background:${THUMBS[s.id] || '#0b0f1d'}"></div>
          <div class="body">
            <span class="badge">${label}</span>
            <h2>${s.name}${g ? ' <small style="font-weight:500;opacity:.55">· Godot</small>' : ''}</h2>
            <p>${s.blurb}</p>
            <div class="enter">${cta}</div>
          </div>
        </${tag}>`;
      };
      grid.innerHTML = scenes.map(s => `<section class="row">
        <h3 class="row-title">${s.name}</h3>
        ${card(s, 'js')}${card(s, 'godot')}
      </section>`).join('');
    } catch (e) {
      grid.innerHTML = '<p style="color:#ff9f6b">Could not load worlds. Check scenes/index.json.</p>';
    }
    document.querySelector('.list').removeAttribute('aria-busy');
  </script>
</body>
</html>
