<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Nature — Glade &amp; Cliffs</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #bfe0f5; overflow: hidden; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 12px; left: 14px; z-index: 10;
    font: 13px/1.5 system-ui, sans-serif; color: rgba(20,30,40,.82);
    text-shadow: 0 1px 2px rgba(255,255,255,.5); pointer-events: none; max-width: 72vw;
  }
  #hud b { color: #1c3a52; font-weight: 650; }
  a.back { position: fixed; top: 12px; right: 14px; z-index: 11; font: 13px system-ui, sans-serif;
    color: #1c3a52; text-decoration: none; text-shadow: 0 1px 2px rgba(255,255,255,.5); }
  #enter {
    position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(60% 60% at 50% 45%, rgba(10,20,30,.25), rgba(10,20,30,.55));
    cursor: pointer; transition: opacity .5s ease;
  }
  #enter .card { text-align: center; color: #eef6ff; font: 500 16px/1.5 system-ui, sans-serif;
    text-shadow: 0 2px 10px rgba(0,0,0,.5); }
  #enter h1 { font-size: 26px; font-weight: 650; margin: 0 0 6px; }
  #enter .go { margin-top: 14px; display: inline-block; padding: 10px 22px; border-radius: 999px;
    background: rgba(255,255,255,.92); color: #16303f; font-weight: 650; }

  /* phone layout: safe areas, no overflow at 375 px, 44px+ touch targets */
  body { -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
  #hud { top: calc(env(safe-area-inset-top, 0px) + 10px) !important; left: calc(env(safe-area-inset-left, 0px) + 12px) !important;
    max-width: calc(100vw - 132px - env(safe-area-inset-left, 0px)) !important; overflow-wrap: anywhere; }
  a.back { top: calc(env(safe-area-inset-top, 0px) + 10px) !important; right: calc(env(safe-area-inset-right, 0px) + 12px) !important; }
  @media (pointer: coarse) {
    a.back { top: calc(env(safe-area-inset-top, 0px) + 4px) !important; padding: 12px 6px; font-size: 15px !important; }
    #hud { font-size: 12px !important; line-height: 1.35 !important; }
  }
</style>
</head>
<body>
  <a class="back" href="../">← Worlds</a>
  <div id="hud">
    <b>Nature — Glade &amp; Cliffs</b><br>
    <span id="help">WASD walk · mouse look · Shift run · hold Z for binoculars · Esc or M for the menu</span>
  </div>

  <div id="enter"><div class="card">
    <h1>Nature — Glade &amp; Cliffs</h1>
    A clearing above the sea. Click to look around &amp; turn on sound.
    <div class="go">Enter →</div>
  </div></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./main.js?v=20261115lie8s"></script>
</body>
</html>
