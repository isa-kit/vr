<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Beach — Sunset Shore — Oortia</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; background: #e7b27d; overflow: hidden; }
  canvas { display: block; }
  #hud {
    position: fixed; top: max(12px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left)); z-index: 10;
    font: 13px/1.5 system-ui, sans-serif; color: rgba(255,255,255,.88);
    text-shadow: 0 1px 4px rgba(0,0,0,.55); pointer-events: none; max-width: calc(100vw - 150px);
  }
  #hud b { font-weight: 650; }
  a.back { position: fixed; top: max(12px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right)); z-index: 11; font: 13px system-ui, sans-serif;
    color: rgba(255,255,255,.9); text-decoration: none; text-shadow: 0 1px 4px rgba(0,0,0,.55); }
  #enter {
    position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(60% 60% at 50% 45%, rgba(10,20,30,.25), rgba(10,20,30,.6));
    cursor: pointer; transition: opacity .6s ease;
  }
  #enter .card { text-align: center; color: #eef6ff; font: 500 16px/1.5 system-ui, sans-serif;
    text-shadow: 0 2px 10px rgba(0,0,0,.5); padding: 0 max(24px, env(safe-area-inset-left)); }
  #enter h1 { font-size: clamp(22px, 7vw, 28px); font-weight: 650; margin: 0 0 6px; }
  #enter .go { margin-top: 14px; display: inline-block; padding: 14px 28px; min-height: 20px; border-radius: 999px;
    background: rgba(255,255,255,.92); color: #16303f; font-weight: 650; }
</style>
</head>
<body>
  <a class="back" href="../">← Worlds</a>
  <div id="hud">
    <b>Beach — Sunset Shore</b><br>
    <span id="help">Drag to look around · arrow keys also turn · Esc / M opens the menu</span>
  </div>

  <div id="enter"><div class="card">
    <h1>Beach — Sunset Shore</h1>
    Sit on warm sand as the waves wash in and out.<br>Tap or click to turn on sound &amp; look around.
    <div class="go">Enter →</div>
  </div></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./main.js?v=20261114lie5"></script>
</body>
</html>
